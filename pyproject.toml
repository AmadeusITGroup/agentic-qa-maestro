[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-qa-maestro"
version = "0.1.0"
description = "Agentic QA Maestro — fully automated testing from JIRA stories to defect management"
readme = "README.md"
license = "Apache-2.0"

authors = [
    {name = "Amadeus Creation Platform", email = "creation-platform@amadeus.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"

dependencies = [
    "agent-framework-core>=1.0.0",
    "agent-framework-openai>=1.0.0",
    "azure-identity>=1.15.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "httpx>=0.27.0",
    "playwright>=1.40.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/AmadeusITGroup/agentic-qa-maestro"
Repository = "https://github.com/AmadeusITGroup/agentic-qa-maestro"
Issues = "https://github.com/AmadeusITGroup/agentic-qa-maestro/issues"

[project.scripts]
qa-maestro = "agentic_qa_maestro.main:main"

[tool.setuptools.packages.find]
include = ["agentic_qa_maestro*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.uv]
prerelease = "allow"
